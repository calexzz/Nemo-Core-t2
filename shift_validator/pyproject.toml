[project]
name = "shift_validator"
version = "0.1.1"
description = "Validation library for work shift scheduling"
authors = [
    {name = "calexzz"}
]
license = "MIT"
requires-python = ">=3.10"
readme = "README.md"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)"
]